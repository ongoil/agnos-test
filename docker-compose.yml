services:
  postgres:
    image: postgres:16
    container_name: agnos-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: agnos-test
      POSTGRES_USER: agnosdb
      POSTGRES_PASSWORD: agnos1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx:
    image: nginx:alpine
    container_name: agnos-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres_data: